name: UW2 Web Fidelity Static Gate

on:
  push:
    branches: [uw2-web-port]
    paths:
      - 'uw2-web/**'
      - '.github/workflows/uw2-web-fidelity.yml'
  workflow_dispatch:

jobs:
  synthetic-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser module and boot-order syntax
        run: |
          node --check uw2-web/web/app.js
          node --check uw2-web/web/boot-sequence.js
          node --check uw2-web/web/koei-exit-flow.js
          node --check uw2-web/web/realmode-8086.js
          node --check uw2-web/web/mz-loader.js
          node --check uw2-web/web/dos-int21.js
          node --check uw2-web/web/bios-int10.js
          node --check uw2-web/web/dos-ivt-snapshot.js
          node --check uw2-web/web/dos-psp-snapshot.js
          node --check uw2-web/tools/p3-koei-exec-probe.mjs
          node --check uw2-web/tools/p3-fmdrv-exec-probe.mjs
          node --check uw2-web/tools/p3-open-exec-probe.mjs
          node --check uw2-web/tests/p3-koei-fmdrv-open-irq-original.test.mjs
          node --check uw2-web/web/dos-com-child-runner.js
          node --check uw2-web/web/vga-indexed-ports.js
          node --check uw2-web/web/vga-dac-ports.js
          node --check uw2-web/web/vga-mode12-planar-witness.js
          node --check uw2-web/web/vga-mode12-read-adapter.js
          node --check uw2-web/web/opl2-raw-write-bus.js
          node --check uw2-web/web/pit8253-counter0-witness.js
          node --check uw2-web/web/guest-staging-physical-map.js
          node --check uw2-web/web/guest-irq-boundary.js
          node --check uw2-web/web/pinned-dos-resources.js
          node --check uw2-web/web/opgraph-original-archive.js
          node --check uw2-web/web/opgraph-korean-evidence.js
          node --check uw2-web/web/opening.js
          node --check uw2-web/web/bios-int16.js
          node --check uw2-web/web/dos-readonly-files.js
          node --check uw2-web/web/dos-original-files.js
          node --check uw2-web/tools/koei-launch-chain.mjs
      - name: Boot and fidelity policies without copyrighted game assets
        run: |
          node uw2-web/tests/boot-sequence.test.mjs
          node uw2-web/tests/koei-exit-flow.test.mjs
          node uw2-web/tests/realmode-8086.test.mjs
          node uw2-web/tests/realmode-8086-alu.test.mjs
          node uw2-web/tests/realmode-8086-indirect.test.mjs
          node uw2-web/tests/realmode-8086-strings.test.mjs
          node uw2-web/tests/realmode-8086-rep-interruptible.test.mjs
          node uw2-web/tests/realmode-8086-carry-loop.test.mjs
          node uw2-web/tests/realmode-8086-group3.test.mjs
          node uw2-web/tests/realmode-8086-data-moves.test.mjs
          node uw2-web/tests/realmode-8086-shifts.test.mjs
          node uw2-web/tests/realmode-8086-jmp-short.test.mjs
          node uw2-web/tests/realmode-80186-koei-shift.test.mjs
          node uw2-web/tests/bios-int10.test.mjs
          node uw2-web/tests/bios-int10-modes.test.mjs
          node uw2-web/tests/realmode-8086-interrupts.test.mjs
          node uw2-web/tests/realmode-8086-io.test.mjs
          node uw2-web/tests/realmode-8086-decimal.test.mjs
          node uw2-web/tests/p1-byte-coverage.test.mjs
          node uw2-web/tests/p1-instruction-ledger.test.mjs
          node uw2-web/tests/p1-rea-snapshot-bridge.test.mjs
          node uw2-web/tests/p1-rea-batch-merge.test.mjs
          node uw2-web/tests/p1-ghidra-chunk-import.test.mjs
          node uw2-web/tests/p1-ghidra-com-import.test.mjs
          node uw2-web/tests/p1-checkpoint-merge.test.mjs
          node uw2-web/tests/mz-loader.test.mjs
          node uw2-web/tests/dos-int21-launch.test.mjs
          node uw2-web/tests/dos-int21-vectors.test.mjs
          node uw2-web/tests/dos-ivt-snapshot.test.mjs
          node uw2-web/tests/dos-psp-snapshot.test.mjs
          node uw2-web/tests/dos-int21-memory.test.mjs
          node uw2-web/tests/dos-int21-resize.test.mjs
          node uw2-web/tests/dos-int21-console.test.mjs
          node uw2-web/tests/dos-int21-string.test.mjs
          node uw2-web/tests/dos-int21-tsr.test.mjs
          node uw2-web/tests/dos-com-child-runner.test.mjs
          node uw2-web/tests/dos-int21-version.test.mjs
          node uw2-web/tests/dos-int21-ioctl.test.mjs
          node uw2-web/tests/vga-indexed-ports.test.mjs
          node uw2-web/tests/vga-dac-ports.test.mjs
          node uw2-web/tests/vga-mode12-planar-witness.test.mjs
          node uw2-web/tests/vga-mode12-read-adapter.test.mjs
          node uw2-web/tests/vga-mode12-latch-readmode1.test.mjs
          node uw2-web/tests/opl2-pit-raw-witness.test.mjs
          node uw2-web/tests/guest-staging-physical-map.test.mjs
          node uw2-web/tests/dos-file-transfer-provenance.test.mjs
          node uw2-web/tests/realmode-8086-memory-witness.test.mjs
          node uw2-web/tests/bios-int10-palette.test.mjs
          node uw2-web/tests/guest-irq-boundary.test.mjs
          node uw2-web/tests/pinned-dos-resources.test.mjs
          node uw2-web/tests/opgraph-original-archive.test.mjs
          node uw2-web/tests/opening-verified-archive.test.mjs
          node uw2-web/tests/dos-int21-drive.test.mjs
          node uw2-web/tests/dos-int21-allocate.test.mjs
          node uw2-web/tests/dos-int21-disk-reset.test.mjs
          node uw2-web/tests/bios-int16.test.mjs
          node uw2-web/tests/dos-readonly-files.test.mjs
          node uw2-web/tests/dos-readonly-files-process.test.mjs
          node uw2-web/tests/dos-file-duplication.test.mjs
          node uw2-web/tests/dos-exec-file-inheritance.test.mjs
          node uw2-web/tests/realmode-8086-fe.test.mjs
          node uw2-web/tests/realmode-8086-divide-interrupt.test.mjs

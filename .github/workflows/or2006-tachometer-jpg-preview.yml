name: OR2006 Tachometer JPG Preview
on:
  push:
    branches:
      - artifacts/or2006-tachometer-jpg-20261116
    paths:
      - tools/or2006_tachometer_preview_20261116.py
      - .github/workflows/or2006-tachometer-jpg-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow only
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Download upstream DDS and convert to JPG
        run: python tools/or2006_tachometer_preview_20261116.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OR2006Sprites-Tachometers-JPG-20261116
          path: output/
          if-no-files-found: error
          retention-days: 7

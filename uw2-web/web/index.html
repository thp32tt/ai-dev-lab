<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>대항해시대 II Web Runtime</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <h1>대항해시대 II Web Runtime</h1>
      <p>원본 DOS 데이터 직접 로드 + REA 기반 브라우저 재구현</p>
    </header>

    <section class="grid">
      <article class="panel">
        <h2>원본 자원</h2>
        <div id="manifest-status">확인 중…</div>
        <div id="manifest"></div>
      </article>

      <article class="panel">
        <h2>세이브 슬롯</h2>
        <div id="save-status">KOUKAI2.DAT 로딩 중…</div>
        <div id="save-slots"></div>
      </article>

      <article class="panel wide">
        <div class="game-head">
          <h2>브라우저 런타임</h2>
          <button id="run-button" disabled>선택 슬롯 시작</button>
          <button id="pause-button" disabled>일시정지</button>
        </div>
        <canvas id="screen" width="640" height="400" aria-label="game screen"></canvas>
        <div id="runtime-status"></div>
      </article>

      <article class="panel wide">
        <h2>원본 KAO.LZW 초상화</h2>
        <div id="kao-status">LS11 디코딩 중…</div>
        <div id="portraits" class="portraits"></div>
      </article>

      <article class="panel">
        <h2>원본 MENU.DAT</h2>
        <div id="menus"></div>
      </article>

      <article class="panel">
        <h2>원본 MESSAGE.DAT</h2>
        <div id="messages"></div>
      </article>

      <article class="panel wide">
        <h2>REA 상태 추적</h2>
        <pre id="debug"></pre>
      </article>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>

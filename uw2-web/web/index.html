<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>대항해시대 II</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <section class="screen-frame" aria-label="대항해시대 II 게임">
      <canvas id="screen" width="640" height="400" aria-label="game screen"></canvas>
      <div id="runtime-status" class="game-status">게임 데이터 로딩 중…</div>
    </section>

    <section id="web-controller" class="controller" aria-label="웹 게임 컨트롤러">
      <div class="controller-head" aria-live="polite">
        <strong id="controller-mode">로딩</strong>
        <span id="controller-music">BGM 준비</span>
      </div>

      <div class="dpad" aria-label="방향키">
        <button class="pad up" data-key="ArrowUp" aria-label="위">▲</button>
        <button class="pad left" data-key="ArrowLeft" aria-label="왼쪽">◀</button>
        <div class="pad-center"></div>
        <button class="pad right" data-key="ArrowRight" aria-label="오른쪽">▶</button>
        <button class="pad down" data-key="ArrowDown" aria-label="아래">▼</button>
      </div>

      <div class="action-pad">
        <div class="face-buttons">
          <button class="action secondary" data-key="Escape"><span>B</span><small>취소</small></button>
          <button class="action primary" data-key="Enter"><span>A</span><small>확인</small></button>
        </div>
        <div class="utility-grid">
          <button class="mini" data-key="p"><b>P</b><small>기항</small></button>
          <button class="mini" data-key="l"><b>L</b><small>적재</small></button>
          <button class="mini" data-key="u"><b>U</b><small>하역</small></button>
          <button class="mini" data-key="m"><b>M</b><small>최대</small></button>
          <button class="mini" data-key="c"><b>C</b><small>흥정</small></button>
          <button class="mini auto" data-action="auto-sail" aria-pressed="false" disabled><b>AUTO</b><small>자동항해</small></button>
        </div>
      </div>

      <div class="system-pad">
        <button data-action="save-prev">◀ SAVE</button>
        <button data-action="start">START</button>
        <button data-action="opening">OPENING</button>
        <button data-action="pause">PAUSE</button>
        <button data-action="sound" aria-pressed="false">🔇 BGM</button>
        <button data-action="track-prev">◀ ♪</button>
        <button data-action="track-next">♪ ▶</button>
        <button data-action="save-next">SAVE ▶</button>
      </div>
    </section>
  </main>

  <div id="runtime-internals" hidden>
    <div id="manifest-status"></div><div id="manifest"></div>
    <div id="save-status"></div><div id="save-slots"></div>
    <button id="opening-button" disabled></button>
    <button id="run-button" disabled></button>
    <button id="pause-button" disabled></button>
    <div id="opening-status"></div><div id="opening-gallery"></div>
    <div id="portmap-status"></div><canvas id="portmap"></canvas>
    <div id="kao-status"></div><div id="portraits"></div>
    <div id="menus"></div><div id="messages"></div>
    <pre id="debug"></pre>
  </div>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./web-controller.js"></script>
</body>
</html>

name: UW2 Web Fidelity Static Gate

on:
  push:
    branches: [uw2-web-port]
    paths:
      - 'uw2-web/**'
      - '.github/workflows/uw2-web-fidelity.yml'
  workflow_dispatch:

jobs:
  synthetic-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser module and boot-order syntax
        run: |
          node --check uw2-web/web/app.js
          node --check uw2-web/web/boot-sequence.js
          node --check uw2-web/web/koei-exit-flow.js
          node --check uw2-web/web/realmode-8086.js
          node --check uw2-web/web/mz-loader.js
          node --check uw2-web/web/dos-int21.js
          node --check uw2-web/web/bios-int10.js
          node --check uw2-web/tools/p3-koei-exec-probe.mjs
          node --check uw2-web/web/dos-readonly-files.js
          node --check uw2-web/web/dos-original-files.js
          node --check uw2-web/tools/koei-launch-chain.mjs
      - name: Boot and fidelity policies without copyrighted game assets
        run: |
          node uw2-web/tests/boot-sequence.test.mjs
          node uw2-web/tests/koei-exit-flow.test.mjs
          node uw2-web/tests/realmode-8086.test.mjs
          node uw2-web/tests/realmode-8086-alu.test.mjs
          node uw2-web/tests/realmode-8086-indirect.test.mjs
          node uw2-web/tests/realmode-8086-strings.test.mjs
          node uw2-web/tests/realmode-8086-carry-loop.test.mjs
          node uw2-web/tests/realmode-8086-group3.test.mjs
          node uw2-web/tests/realmode-8086-data-moves.test.mjs
          node uw2-web/tests/realmode-8086-shifts.test.mjs
          node uw2-web/tests/realmode-80186-koei-shift.test.mjs
          node uw2-web/tests/bios-int10.test.mjs
          node uw2-web/tests/realmode-8086-interrupts.test.mjs
          node uw2-web/tests/realmode-8086-io.test.mjs
          node uw2-web/tests/realmode-8086-decimal.test.mjs
          node uw2-web/tests/p1-byte-coverage.test.mjs
          node uw2-web/tests/p1-instruction-ledger.test.mjs
          node uw2-web/tests/p1-rea-snapshot-bridge.test.mjs
          node uw2-web/tests/p1-rea-batch-merge.test.mjs
          node uw2-web/tests/p1-ghidra-chunk-import.test.mjs
          node uw2-web/tests/p1-ghidra-com-import.test.mjs
          node uw2-web/tests/p1-checkpoint-merge.test.mjs
          node uw2-web/tests/mz-loader.test.mjs
          node uw2-web/tests/dos-int21-launch.test.mjs
          node uw2-web/tests/dos-int21-vectors.test.mjs
          node uw2-web/tests/dos-readonly-files.test.mjs
          node uw2-web/tests/realmode-8086-fe.test.mjs
          node uw2-web/tests/realmode-8086-divide-interrupt.test.mjs
          node uw2-web/tests/dos-original-files.test.mjs
          node uw2-web/tests/fidelity-policy.test.mjs
          node uw2-web/tests/mz-relocation-callgraph.test.mjs
